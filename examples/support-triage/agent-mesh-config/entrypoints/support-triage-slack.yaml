kind: entrypoint
name: support-triage-slack
description: Slack bot that triages customer issues posted by the support team.
spec:
  type: slack
  deploy: true
  values:
    default_agent_name: ticket-triage
    bot_token: ${SLACK_BOT_TOKEN}
    app_token: ${SLACK_APP_TOKEN}

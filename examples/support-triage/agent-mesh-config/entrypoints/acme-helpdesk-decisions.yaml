kind: entrypoint
name: acme-helpdesk-decisions
description: Receives signed high-throughput tickets from the Acme Help Desk and starts the ticket-decision workflow.
spec:
  type: webhook
  slug: acme-helpdesk-decisions
  deploy: true
  values:
    routePath: /tickets
    method: POST
    authMode: hmac
    hmacSecret: ${ACME_HELPDESK_WEBHOOK_SECRET}
    hmacHeader: X-Hub-Signature-256
    hmacAlgorithm: sha256
    hmacPrefix: "sha256="
    hmacEncoding: hex
    inputExpression: "input.payload:"
    targetWorkflowName: ticket-decision
